name: Build complete QM1 PDFs
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qm1-complete-pdfs-20261017
    paths:
      - 'scripts/build_complete_pdfs.py'
      - 'scripts/audit_numeric.py'
      - 'revised-worksheets-2026.json'
      - 'exercise-data-export.json'
      - 'pedagogy-upgrade-2026.json'
      - 'app.js'
      - '.github/workflows/qm1-complete-pdfs.yml'
permissions:
  contents: write
jobs:
  generate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF rendering and verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.5
          npm install --no-save mathjax-full@3.2.2
          python -m playwright install --with-deps chromium
      - name: Independently verify worked-example arithmetic
        run: python scripts/audit_numeric.py
      - name: Generate and verify 28 bilingual PDFs
        run: python scripts/build_complete_pdfs.py
      - name: Publish validated PDFs on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/chapter-*-exercises-*.pdf downloads/chapter-*-solutions-*.pdf downloads/QM1_2026-2027_28_PDF_FR_EN.zip downloads/QM1_PDF_manifest_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 28 verified QM1 bilingual PDFs (all 38 exercises)"
            git push origin HEAD:main
          fi
      - name: Preserve audit manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qm1-pdf-audit
          path: downloads/QM1_PDF_manifest_2026.json

      - name: Preserve complete PDFs for independent visual review
        uses: actions/upload-artifact@v4
        with:
          name: qm1-complete-pdfs-preview
          path: |
            downloads/chapter-*-exercises-*.pdf
            downloads/chapter-*-solutions-*.pdf
            downloads/QM1_2026-2027_28_PDF_FR_EN.zip
