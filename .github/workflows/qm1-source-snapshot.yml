name: QM1 source snapshot for LaTeX QA
on:
  push:
    branches: [qm1-academic-latex-20261017]
    paths: ['.github/workflows/qm1-source-snapshot.yml']
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: qm1-current-sources-for-local-audit
          path: |
            revised-worksheets-2026.json
            exercise-data-export.json
            pedagogy-upgrade-2026.json
            app.js
            scripts/build_academic_latex.py
